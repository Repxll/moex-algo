# Каталог 100 стратегий для бэктеста (MOEX / Т-Инвестиции)
# Описание полей и протокол теста — в strategies-README.md
# evidence: A — рецензируемые исследования на многих рынках; B — исследования есть, но результаты смешанные или эффект слабеет;
#           C — бэктесты практиков; D — гипотеза или специфика MOEX, проверяем сами; base — контрольная стратегия
# fit_10k: "yes" — реализуемо на 10 тыс. ₽; limited — с оговорками (лоты, комиссии, ГО); no — нужен больший капитал или квалификация
# horizon — типичное удержание в торговых днях

strategies:
# ---------- БАЗОВЫЕ (с ними сравниваем всё остальное) ----------
- {id: 1, name: "Купил и держи индекс полной доходности", class: index, family: baseline, horizon: "всегда", rules: {entry: "купить фонд на IMOEX/MCFTR в начале периода", exit: "нет"}, data: "MCFTR (ISS)", evidence: base, fit_10k: "yes", source: "контроль"}
- {id: 2, name: "Денежный рынок / флоатеры", class: money, family: baseline, horizon: "всегда", rules: {entry: "держать фонд денежного рынка", exit: "нет"}, data: "RUSFAR / индекс денежного рынка (ISS)", evidence: base, fit_10k: "yes", source: "контроль, безрисковая ставка"}
- {id: 3, name: "Портфель 60/40 акции/ОФЗ с ежеквартальной ребалансировкой", class: multi, family: baseline, horizon: "квартал", rules: {entry: "60% MCFTR + 40% RGBITR", exit: "ребаланс раз в квартал"}, data: "MCFTR, RGBITR (ISS)", evidence: base, fit_10k: "yes", source: "классический портфель"}

# ---------- ТРЕНД / МОМЕНТУМ: индексы и акции ----------
- {id: 4, name: "SMA10 месячная (Faber)", class: index, family: trend_ma, horizon: "месяцы", rules: {entry: "месячное закрытие > SMA10 → в индекс", exit: "закрытие < SMA10 → в деньги"}, params: {ma: 10, tf: month}, data: "MCFTR", evidence: A, fit_10k: "yes", source: "Faber 2007/2018 JPM"}
- {id: 5, name: "Абсолютный моментум 12 мес по индексу", class: index, family: abs_momentum, horizon: "месяцы", rules: {entry: "доходность за 12 мес > доходности денег → индекс", exit: "иначе деньги"}, params: {lookback_m: 12}, data: "MCFTR, RUSFAR", evidence: A, fit_10k: "yes", source: "Moskowitz-Ooi-Pedersen 2012; Antonacci"}
- {id: 6, name: "Двойной моментум между классами", class: multi, family: dual_momentum, horizon: "месяцы", rules: {entry: "раз в мес лучший из {акции, золото, ОФЗ} по 12 мес, если он лучше денег", exit: "смена лидера или уход в деньги"}, params: {lookback_m: [3,6,12]}, data: "MCFTR, GOLD, RGBITR, RUSFAR", evidence: B, fit_10k: "yes", source: "Antonacci; Pitkäjärvi et al 2019"}
- {id: 7, name: "Золотой крест SMA50/200", class: index, family: trend_ma, horizon: "месяцы", rules: {entry: "SMA50 пересекает SMA200 вверх", exit: "пересечение вниз"}, params: {fast: 50, slow: 200}, data: "IMOEX daily", evidence: B, fit_10k: "yes", source: "классика тех. анализа; Brock-Lakonishok-LeBaron 1992"}
- {id: 8, name: "Пробой канала Дончиана 20/10", class: index, family: donchian, horizon: "недели", rules: {entry: "закрытие > max(20)", exit: "закрытие < min(10)"}, params: {entry_n: 20, exit_n: 10}, data: "IMOEX daily", evidence: B, fit_10k: "yes", source: "правила «черепах»"}
- {id: 9, name: "Пробой канала Дончиана 55/20", class: index, family: donchian, horizon: "месяцы", rules: {entry: "закрытие > max(55)", exit: "закрытие < min(20)"}, params: {entry_n: 55, exit_n: 20}, data: "IMOEX daily", evidence: B, fit_10k: "yes", source: "правила «черепах»"}
- {id: 10, name: "Трендовая позиция с таргетом волатильности", class: index, family: vol_target, horizon: "недели", rules: {entry: "индекс выше SMA200; доля = целевая вола / реализованная вола(20)", exit: "ниже SMA200; ежедневная подгонка доли с порогом"}, params: {target_vol: 0.15}, data: "IMOEX daily", evidence: A, fit_10k: "limited", source: "Moreira-Muir 2017 (vol-managed portfolios)"}
- {id: 11, name: "Кросс-секционный моментум 12-1", class: stocks, family: xs_momentum, horizon: "месяц", rules: {entry: "раз в мес топ-N из индекса по доходности 12 мес без последнего", exit: "выпадение из топа при ребалансе"}, params: {lookback_m: 12, skip_m: 1, top_n: 5}, data: "состав IMOEX, дневные свечи", evidence: A, fit_10k: "limited", source: "Jegadeesh-Titman 1993; «Альфа-Капитал» 2007–2024"}
- {id: 12, name: "Моментум 3/3 для РФ", class: stocks, family: xs_momentum, horizon: "квартал", rules: {entry: "раз в 3 мес топ-N по доходности 3 мес", exit: "через 3 мес"}, params: {lookback_m: 3, hold_m: 3, top_n: 5}, data: "состав IMOEX", evidence: B, fit_10k: "limited", source: "Финансовый журнал 2023"}
- {id: 13, name: "Близость к 52-недельному максимуму", class: stocks, family: high52, horizon: "месяц", rules: {entry: "раз в мес топ-N по отношению цена/max(252)", exit: "ребаланс"}, params: {top_n: 5}, data: "состав IMOEX", evidence: A, fit_10k: "limited", source: "George-Hwang 2004"}
- {id: 14, name: "Секторная ротация", class: stocks, family: sector_rotation, horizon: "месяц", rules: {entry: "раз в мес 2 лучших отраслевых индекса Мосбиржи по 6 мес, доступ через лидеров отрасли или фонды", exit: "ребаланс"}, params: {lookback_m: 6, top_n: 2}, data: "MOEXOG, MOEXFN, MOEXMM, MOEXEU, MOEXTL, MOEXCN, MOEXCH", evidence: B, fit_10k: "limited", source: "Moskowitz-Grinblatt 1999 (industry momentum)"}
- {id: 15, name: "Линия относительной силы на новом максимуме", class: stocks, family: rel_strength, horizon: "недели", rules: {entry: "отношение акция/IMOEX на 50-дн максимуме и акция выше SMA50", exit: "отношение ниже своей SMA20"}, data: "акции + IMOEX", evidence: C, fit_10k: "yes", source: "O'Neil / Минервини (практика)"}
- {id: 16, name: "Пересечение MACD с фильтром SMA200", class: stocks, family: osc_trend, horizon: "недели", rules: {entry: "MACD(12,26,9) пересекает сигнальную вверх, цена > SMA200", exit: "пересечение вниз"}, data: "акции/индекс daily", evidence: C, fit_10k: "yes", source: "Appel (практика)"}
- {id: 17, name: "ADX и пересечение DI", class: stocks, family: osc_trend, horizon: "недели", rules: {entry: "ADX(14)>25 и +DI пересекает -DI вверх", exit: "-DI выше +DI или ADX<20"}, data: "daily", evidence: C, fit_10k: "yes", source: "Wilder 1978"}
- {id: 18, name: "Supertrend", class: stocks, family: atr_trend, horizon: "недели", rules: {entry: "цена закрылась выше Supertrend(10,3)", exit: "закрытие ниже линии"}, params: {atr: 10, mult: 3}, data: "daily", evidence: C, fit_10k: "yes", source: "практика"}
- {id: 19, name: "Пробой канала Кельтнера", class: stocks, family: channel_break, horizon: "недели", rules: {entry: "закрытие > EMA20 + 2*ATR(10)", exit: "закрытие < EMA20"}, data: "daily", evidence: C, fit_10k: "yes", source: "Keltner/Raschke (практика)"}
- {id: 20, name: "Пробой полос Боллинджера", class: stocks, family: channel_break, horizon: "недели", rules: {entry: "закрытие > SMA20 + 2σ", exit: "закрытие < SMA20"}, data: "daily", evidence: C, fit_10k: "yes", source: "Bollinger (практика)"}
- {id: 21, name: "Пробой NR7", class: stocks, family: volatility_break, horizon: "3-7", rules: {entry: "день с самым узким диапазоном за 7 дней → стоп-заявка на пробой high", exit: "закрытие ниже low дня NR7 или через 5 дней"}, data: "daily", evidence: C, fit_10k: "yes", source: "Crabel 1990"}
- {id: 22, name: "Пробой внутреннего бара", class: stocks, family: volatility_break, horizon: "3-7", rules: {entry: "внутренний бар при цене > SMA50 → покупка на пробое high", exit: "стоп под low бара, выход через 5 дней или 2R"}, data: "daily", evidence: C, fit_10k: "yes", source: "практика"}
- {id: 23, name: "Пробой диапазона первого часа", class: stocks, family: orb_intraday, horizon: "1", rules: {entry: "пробой high первых 60 минут основной сессии", exit: "закрытие сессии или стоп за low диапазона"}, data: "минутки T-Invest", evidence: C, fit_10k: "limited", source: "Crabel 1990; Zarattini-Aziz 2023 (ORB, US)"}
- {id: 24, name: "Gap-and-go", class: stocks, family: gap, horizon: "1-3", rules: {entry: "гэп вверх >2% при объёме первого часа > 2× среднего, покупка на пробое high первых 15 мин", exit: "трейлинг под VWAP или закрытие дня 3"}, data: "минутки", evidence: C, fit_10k: "limited", source: "практика (r/algotrading)"}
- {id: 25, name: "Продолжение после новостного гэпа", class: stocks, family: gap, horizon: "3-7", rules: {entry: "гэп >3% на отчёте/новости и закрытие в верхней трети дня", exit: "закрытие ниже low дня гэпа или 7 дней"}, data: "daily + календарь событий", evidence: C, fit_10k: "yes", source: "практика; PEAD-подобный эффект"}

