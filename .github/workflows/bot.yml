name: strategy-60-bot
on:
  schedule:
    - cron: "7,22,37,52 6-16 * * 1-5"   # every 15 min (off the busy :00), 09:00–19:59 MSK, weekdays
  workflow_dispatch:
    inputs:
      dry_scan:
        description: "Only print today's signals (no Telegram, no orders)"
        type: boolean
        default: false
concurrency:
  group: bot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dry scan
        if: ${{ inputs.dry_scan }}
        run: python -c "from bot import signals; b,_=signals.scan(); print('signals:', [(x['secid'], round(x['yield'],3), x['days_left']) for x in b])"
      - name: Run one bot step
        if: ${{ !inputs.dry_scan }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
        run: python -m bot.main --once
      - name: Save state
        if: always()
        run: |
          git config user.name "strategy-60-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bot/state.json bot/journal.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "bot state" && git push)
